name: Deploy Exwhyzee EDI to Hostinger VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Hostinger

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Self-Contained Web Application
        run: |
          dotnet publish ExwhyzeeEDI.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o ./publish

      - name: Copy Deploy Script into Package
        run: |
          tr -d '\r' < deploy.sh > ./publish/deploy.sh
          chmod +x ./publish/deploy.sh

      - name: Package Artifact
        run: |
          tar -czf app-package.tar.gz -C ./publish .

      - name: Deploy to Hostinger VPS
        env:
          HOST: ${{ secrets.HOSTINGER_SERVER_IP }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          DOTENV_SECRET: ${{ secrets.DOTENV }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          echo ">>> Transferring package to Hostinger VPS ($HOST)..."
          scp $SSH_OPTS -P $PORT app-package.tar.gz $USER@$HOST:/tmp/app-package.tar.gz

          echo ">>> Executing deployment script on Hostinger..."
          ssh $SSH_OPTS -p $PORT $USER@$HOST "DOTENV_SECRET=\"$DOTENV_SECRET\" bash -s" < deploy.sh
